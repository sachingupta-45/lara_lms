services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    container_name: crm_app
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - crm_network

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: crm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - crm_network

networks:
  crm_network:
    driver: bridge
